apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.teamName }}
  labels:
    team: ${{ values.teamName }}
    managed-by: backstage
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ${{ values.teamName }}-quota
  namespace: ${{ values.teamName }}
spec:
  hard:
    requests.cpu: "${{ values.cpuLimit }}"
    requests.memory: "${{ values.memoryLimit }}"
    limits.cpu: "${{ values.cpuLimit }}"
    limits.memory: "${{ values.memoryLimit }}"
    pods: "${{ values.maxPods }}"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${{ values.teamName }}-default-deny
  namespace: ${{ values.teamName }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              team: ${{ values.teamName }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              team: ${{ values.teamName }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
